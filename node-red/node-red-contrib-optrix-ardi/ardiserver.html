<script type="text/javascript">
    RED.nodes.registerType('ardi-server',{
        category: 'config',
        defaults: {
            host: {value:"localhost",required:true},
			site: {value:"default",required:true},
            port: {value:"",required:false},
			ssl: {value:false,required:true}
        },
        label: function() {			
			return this.host + "/s/" + this.site;		
        }
    });
</script>

<script type="text/html" data-template-name="ardi-server">
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-bookmark"></i> Host</label>
        <input type="text" id="node-config-input-host">
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-bookmark"></i> Port</label>
        <input type="text" id="node-config-input-port">
    </div>
	<div class="form-row">
        <label for="node-config-input-site"><i class="fa fa-bookmark"></i> Site</label>
        <input type="text" id="node-config-input-site">
    </div>
	<div class="form-row">
        <label for="node-config-input-ssl"><i class="fa fa-bookmark"></i> SSL/TLS</label>
        <input type="checkbox" id="node-config-input-ssl">
    </div>
</script>
